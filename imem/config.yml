# iMem application/model constants.
# Infra/connection settings live in config.ini; loaded together by imem/config.py.

encoder:
  # Hugging Face model id for the dual encoder (auto-downloaded on first use).
  model_id: google/siglip2-base-patch16-224
  # Images per batch when encoding.
  batch_size: 32

vector_store:
  # Points per batch when upserting into Qdrant.
  upsert_batch_size: 256
  # Default number of results returned by a search.
  top_k: 5
  # Similarity metric: cosine | euclid | dot | manhattan.
  distance: cosine

dataset:
  # Root dir for materialized/downloaded test data (relative to project root).
  data_dir: data

indexer:
  # Images encoded + upserted per round before persisting to Qdrant. Smaller =
  # more frequent writes (less lost on interrupt), more upsert round-trips.
  chunk_size: 512
  # Skip images below these minimums during indexing. Defaults of 1 keep
  # everything, including 2-D / single-channel grayscale (channels are counted
  # as image bands: grayscale=1, RGB=3, RGBA=4). Raise min_channels to 3 to drop
  # grayscale, or min_width/min_height to drop thumbnails.
  min_channels: 1
  min_height: 128
  min_width: 128
  # File extensions treated as images during recursive folder scans (case-insensitive).
  extensions:
    - .jpg
    - .jpeg
    - .png
    - .webp
    - .bmp
    - .gif
