# iMem Qdrant connection & infra settings.
# Application/model constants live in config.yml; loaded together by imem/config.py.

[qdrant]
host = localhost
port = 6333
grpc_port = 6334
collection = images
storage = ./qdrant_storage

[api]
# Base directory for resolving image paths stored as *relative* (legacy
# collections indexed before absolute paths). Absolute stored paths are served
# as-is; leave empty to resolve relative paths against the server's working
# directory.
base_dir =
